# Triggered by onryde/seazn.club's build-and-dispatch.yml via
# repository_dispatch after it builds+pushes app/placement images to GHCR.
# Pulls those images and the black-box spec-file artifact, runs the smoke-e2e
# suite against them instead of rebuilding from source.
#
# This is a starting skeleton, not the full private-repo e2e.yml port: it
# proves the pull/artifact/run plumbing with one suite (smoke-e2e). Porting
# the sharded e2e-parallel/e2e-serial/e2e-mobile matrix (7 widths) is a
# follow-up once this leg is green.
#
# Requires (this repo's secrets, set once):
#   SOURCE_REPO_PAT — read-only PAT scoped to onryde/seazn.club, used to
#     download the artifact `gh run download` produced there (cross-repo
#     artifact download needs auth; this repo's own GITHUB_TOKEN has no
#     access to the private repo's runs).
# GHCR image pull uses this repo's own GITHUB_TOKEN — works once the
# packages in onryde/seazn.club grant this repo's Actions "Read" access
# (GHCR package settings → Manage Actions access). Falls back to
# SOURCE_REPO_PAT (needs read:packages) if that grant is blocked by org policy.
name: Run e2e (pulled images)

on:
  repository_dispatch:
    types: [run-e2e]

permissions:
  contents: read
  packages: read

concurrency:
  group: run-e2e-${{ github.event.client_payload.sha }}
  cancel-in-progress: true

jobs:
  smoke-e2e:
    name: smoke-e2e (pulled images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seazn_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - name: Docker login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull app + placement images
        run: |
          docker pull "${{ github.event.client_payload.app_image }}"
          docker pull "${{ github.event.client_payload.placement_image }}"

      - name: Download black-box spec artifact
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          gh run download "${{ github.event.client_payload.run_id }}" \
            --repo "${{ github.event.client_payload.source_repo }}" \
            --name "e2e-specs-${{ github.event.client_payload.sha }}" \
            --dir /tmp/e2e-bundle
          mkdir -p spec-tree
          tar -xzf /tmp/e2e-bundle/e2e-specs.tar.gz -C spec-tree
          # The tarball's package.json is the monorepo ROOT's — its deps use
          # pnpm's workspace:* protocol, which plain `npm install` can't
          # resolve (EUNSUPPORTEDPROTOCOL). Only tarred for reference; not
          # needed to install/run Playwright, so drop it before npm touches
          # this directory.
          rm -f spec-tree/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install Playwright
        working-directory: spec-tree
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run app container
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="postgres://postgres:postgres@localhost:5432/seazn_e2e" \
            -e REDIS_URL="redis://localhost:6379" \
            "${{ github.event.client_payload.app_image }}"

      - name: Run placement container
        run: |
          docker run -d --name placement --network host \
            "${{ github.event.client_payload.placement_image }}"

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "app never came up"; docker logs app; exit 1

      - name: Run smoke-e2e suite
        working-directory: spec-tree
        env:
          E2E_PROD_TARGET: "http://localhost:3000"
        run: npx playwright test --config=apps/web/playwright.config.ts --project=smoke-e2e

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs app || true
          docker logs placement || true
